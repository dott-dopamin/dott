<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>DOTT 머더미스터리</title>
<!-- v71: public UI baseline shared with boardgame/deduction; no duplicated topbar/hero CSS -->
<link rel="stylesheet" href="styles.css?v=20260925-catalog-layout-sync">
<!-- DOTT murder layout exact-sync: boardgame/deduction spacing baseline + murder-only features -->
<style>
/*
  v71 구조 정리 원칙
  - shell/topbar/brand/nav/admin-link/page/hero/eyebrow/footer/기본 field 등 공통 UI는 styles.css를 그대로 사용한다.
  - 이 파일에서는 머더미스터리 전용 기능과 표/공지 팝업만 정의한다.
  - 상단 공통 UI를 이 파일에서 다시 정의하지 않아 다른 공개 페이지와 크기가 어긋나는 일을 막는다.
*/
/* 보드게임/추리게임 공개 리스트와 같은 공통 레이아웃 값 사용 */
.catalog-page .hero p{font-size:14px!important;line-height:1.7!important}
.murder-page #desc{white-space:pre-line}
.murder-page .stat-row{align-items:center}

/* 필터는 공통 .filters의 간격/마진을 그대로 사용하고, 3개 열 비율만 지정 */
.murder-page .filters.filters-compact{grid-template-columns:1.5fr repeat(2,minmax(130px,.65fr))}

/* 머더 리스트 전용 표 */
.murder-page .catalog-table-wrap{overflow:hidden}
.murder-page .catalog-table{width:100%;min-width:0;border-collapse:collapse;table-layout:fixed}
.murder-page .catalog-table th,.murder-page .catalog-table td{padding:12px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.murder-page .catalog-table th{background:#fbf7f0;color:#756a60;font-size:11px;font-weight:600;text-align:center}
.murder-page .catalog-table tbody tr:last-child td{border-bottom:0}
@media (hover:hover) and (pointer:fine){
  .murder-page .catalog-table tbody tr:hover{background:#fffaf4}
}
.murder-page .catalog-table td:nth-child(1),.murder-page .catalog-table td:nth-child(7){text-align:left}
.murder-page .catalog-table td:nth-child(n+2):nth-child(-n+6){text-align:center}
.murder-page .catalog-table th:nth-child(1),.murder-page .catalog-table td:nth-child(1){width:29%}
.murder-page .catalog-table th:nth-child(2),.murder-page .catalog-table td:nth-child(2){width:8%}
.murder-page .catalog-table th:nth-child(3),.murder-page .catalog-table td:nth-child(3){width:10%}
.murder-page .catalog-table th:nth-child(4),.murder-page .catalog-table td:nth-child(4){width:11%}
.murder-page .catalog-table th:nth-child(5),.murder-page .catalog-table td:nth-child(5){width:14%}
.murder-page .catalog-table th:nth-child(6),.murder-page .catalog-table td:nth-child(6){width:13%}
.murder-page .catalog-table th:nth-child(7),.murder-page .catalog-table td:nth-child(7){width:15%}
.murder-page .catalog-name{font-weight:600}
.murder-page .catalog-name-inner{display:flex;align-items:flex-start;gap:7px;min-width:0;width:100%;max-width:100%}
.murder-page .catalog-name-text{display:-webkit-box;flex:0 1 auto;min-width:0;max-width:calc(100% - 48px);overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:2;white-space:normal;line-height:1.3;overflow-wrap:anywhere}
.murder-page .catalog-owner,.murder-page .catalog-note{color:var(--muted)!important;font-weight:400!important}
.note-mobile{display:none}
.murder-page .status{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:10.5px;font-weight:700}
.murder-page .status.owned{background:#e8f5eb;color:#2f7a45}
.murder-page .status.rented{background:#fff1dd;color:#b76513}
.murder-page .status.lost{background:#fde7e7;color:#b63b3b}
.murder-page .status.dott{background:#e8f1ff;color:#3567a8}
.murder-page .status.workshop{background:#f1e9fb;color:#7350a5}
.online-badge{display:inline-flex;flex:0 0 auto;padding:3px 6px;border-radius:999px;background:#eee7fb;color:#6d55a0;font-size:9px;font-weight:700;vertical-align:middle}
.warn{margin-bottom:14px;padding:10px 12px;border:1px solid #ead7c4;border-radius:12px;background:#fff8ef;color:#765c43;font-size:12px;line-height:1.5}
.retry{margin-left:8px;border:1px solid #ddc6b0;background:#fff;border-radius:8px;padding:5px 8px;color:#765c43;cursor:pointer}

/* 머더 공지 버튼/팝업 전용 */
.notice-open-btn{appearance:none;border:1px solid #e8a27f;border-radius:10px;background:var(--accent-soft);padding:5px 10px;line-height:1.2;color:#9a3f18;font-size:12px;font-weight:800;cursor:pointer;box-shadow:none;transition:background .16s ease,border-color .16s ease,transform .16s ease;text-align:center;white-space:nowrap;align-self:center}
.notice-open-btn.is-loading{visibility:hidden}
.notice-open-btn:hover{background:#ffdccc;border-color:#df8458;transform:translateY(-1px)}
.notice-open-btn:focus-visible{outline:3px solid rgba(233,93,32,.20);outline-offset:2px}
.murder-notice-backdrop{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(35,29,24,.46)}
.murder-notice-backdrop.open{display:flex}
.murder-notice-modal{width:min(560px,100%);max-height:calc(100dvh - 36px);overflow:auto;border:1px solid var(--line);border-radius:18px;background:#fffefa;box-shadow:0 24px 70px rgba(0,0,0,.22)}
.murder-notice-head{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line)}
.murder-notice-head h3{margin:0;font-size:19px}
.murder-notice-close{width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#5d544d;cursor:pointer}
.murder-notice-content{padding:20px;font-size:13px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere;color:#3b342e}
.murder-notice-empty{color:var(--muted)}
body.murder-notice-open{overflow:hidden}

@media(max-width:700px){
  /* 상단/메뉴/페이지/제목은 공통 CSS에 맡기고 머더 고유 영역만 조정 */
  .notice-open-btn{padding:5px 9px;font-size:11px;line-height:1.2}
  .murder-page .filters.filters-compact{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .murder-page .filters .search-field{grid-column:1/-1}
  .murder-page .filters .field{padding:9px 8px;min-height:36px;font-size:11px;line-height:1.2}

  .murder-page .catalog-table-wrap{overflow:hidden}
  .murder-page .catalog-table{min-width:0!important;width:100%!important;table-layout:fixed}
  .murder-page .catalog-table th,.murder-page .catalog-table td{padding:7px 1px;font-size:7.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .murder-page .catalog-table th{font-size:6.7px;letter-spacing:-.38px;text-align:center!important}
  .murder-page .catalog-table th:nth-child(1),.murder-page .catalog-table td:nth-child(1){width:36%;padding-left:3px}
  .murder-page .catalog-table th:nth-child(2),.murder-page .catalog-table td:nth-child(2){width:7%}
  .murder-page .catalog-table th:nth-child(3),.murder-page .catalog-table td:nth-child(3){width:7%}
  .murder-page .catalog-table th:nth-child(4),.murder-page .catalog-table td:nth-child(4){width:10%;overflow:visible;text-overflow:clip}
  .murder-page .catalog-table th:nth-child(5),.murder-page .catalog-table td:nth-child(5){width:10%}
  .murder-page .catalog-table th:nth-child(6),.murder-page .catalog-table td:nth-child(6){width:12%;overflow:visible;text-overflow:clip}
  .murder-page .catalog-table th:nth-child(7),.murder-page .catalog-table td:nth-child(7){width:18%;padding-right:3px;padding-left:2px}
  .murder-page .catalog-table td:nth-child(1),.murder-page .catalog-table td:nth-child(7){text-align:left}
  .murder-page .catalog-table td:nth-child(n+2):nth-child(-n+6){text-align:center}
  .murder-page .catalog-table td.catalog-name{overflow:hidden;text-overflow:clip;line-height:1.18;padding-top:7px;padding-bottom:7px}
  .murder-page .catalog-name-inner{gap:2px;align-items:center;width:100%;max-width:100%}
  .murder-page .catalog-name-text{display:-webkit-box;flex:0 1 auto;min-width:0;max-width:calc(100% - 22px);font-size:7.2px;letter-spacing:-.28px;line-height:1.22;white-space:normal;overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
  .online-badge{padding:2px 2px;font-size:5.6px;white-space:nowrap;margin-top:0;align-self:center}
  .murder-page .catalog-table td:nth-child(4),.murder-page .catalog-table td:nth-child(6){font-size:7px;letter-spacing:-.28px}
  .murder-page .catalog-note{font-size:6.6px!important;letter-spacing:-.3px}
  .note-desktop{display:none}.note-mobile{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .murder-page .status{padding:2px 3px;font-size:6.6px}
}
</style>

</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">D</span><span><strong>DOTT</strong><small>도트 예약 현황</small></span></a>
    <nav class="nav"><a href="index.html">예약 캘린더</a><a href="boardgames.html">보드게임</a><a class="active" href="murder.html">머더미스터리</a><a href="deduction.html">추리게임</a></nav>
    <a class="admin-link" href="admin.html">🔒 관리</a>
  </header>
  <main class="page catalog-page murder-page">
    <section class="hero">
      <span class="eyebrow">🎲 보유 현황</span>
      <h1>머더미스터리 리스트</h1>
      <p id="desc">• 이용 시 소유주에게 참가비 확인 후 허락받고 사용해 주세요.\n• 기물 파손 및 분실 시 소유주에게 책임지고 배상하세요. (CCTV 작동중)</p>
      <div class="stat-row">
        <span class="stat-pill"><span class="stat-label">전체</span><b id="total">0개</b></span>
        <button id="murderNoticeBtn" class="notice-open-btn is-loading" type="button" aria-label="머더미스터리 공지">📌 공지</button>
      </div>
    </section>
    <section class="section">
      <div id="notice"></div>
      <div class="filters filters-compact">
        <input id="q" class="field search-field" placeholder="게임명 검색">
        <select id="players" class="field"><option value="">인원 전체</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option></select>
        <select id="difficulty" class="field"><option value="">난이도 전체</option><option>입문</option><option>쉬움</option><option>중간</option><option>어려움</option><option>매우어려움</option></select>
      </div>
      <div class="catalog-meta"><span id="count">목록을 불러오는 중...</span></div>
      <div id="content"><div class="loading">목록을 불러오는 중...</div></div>
    </section>
  </main>
  <footer class="footer"><span>📅 DOTT · 예약과 보유 게임을 한눈에</span><span>© 2026 도파민</span></footer>
</div>
<div id="murderNoticeModal" class="murder-notice-backdrop" aria-hidden="true"><div id="murderNoticeDialog" class="murder-notice-modal" role="dialog" aria-modal="true" aria-label="머더미스터리 공지"><div class="murder-notice-head"><h3 id="murderNoticeTitle"></h3><button id="murderNoticeClose" class="murder-notice-close" type="button" aria-label="닫기">✕</button></div><div id="murderNoticeContent" class="murder-notice-content murder-notice-empty">등록된 공지가 없습니다.</div></div></div>
<script>
(function(){
  'use strict';
  const API='https://rblwvzokyblnmmdscvsd.supabase.co';
  const KEY='sb_publishable_wp_40b8UIumyLkLhvflzTw_08EaA1wZ';
  const ONLINE='__DOTT_ONLINE_MURDER__';
  const CACHE='dott_murder_v41';
  const DESC_CACHE='dott_murder_description_v1';
  const DEFAULT_DESC='• 이용 시 소유주에게 참가비 확인 후 허락받고 사용해 주세요.\n• 기물 파손 및 분실 시 소유주에게 책임지고 배상하세요. (CCTV 작동중)';
  let items=[];
  let murderNotice='';
  let murderNoticeButtonLabel='이용수칙 · 공지 보기';
  let murderNoticeScrollPad='';
  const $=id=>document.getElementById(id);
  const esc=(v='')=>String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const delay=ms=>new Promise(r=>setTimeout(r,ms));
  async function get(path,retries=2){
    let last;
    for(let i=0;i<=retries;i++){
      const controller=new AbortController();
      const timer=setTimeout(()=>controller.abort(),10000);
      try{
        const r=await fetch(API+path,{headers:{apikey:KEY},signal:controller.signal,cache:'no-store'});
        const txt=await r.text();
        let data=[]; try{data=txt?JSON.parse(txt):[]}catch{data=txt}
        if(!r.ok)throw new Error((data&&data.message)||`요청 실패 (${r.status})`);
        return data;
      }catch(e){last=e;if(i<retries)await delay(400*(i+1));}
      finally{clearTimeout(timer)}
    }
    throw last||new Error('연결 오류');
  }
  try{
    const cachedDesc=localStorage.getItem(DESC_CACHE);
    if(cachedDesc&&cachedDesc.trim())$('desc').textContent=cachedDesc;
  }catch(_e){}

  function applySettings(st){
    if(!st)return;
    const liveDesc=String(st.murder_description||'').trim();
    if(liveDesc){
      $('desc').textContent=liveDesc;
      try{localStorage.setItem(DESC_CACHE,liveDesc)}catch(_e){}
    }else if(!$('desc').textContent.trim()){
      $('desc').textContent=DEFAULT_DESC;
    }
    murderNotice=st.murder_notice||'';
    murderNoticeButtonLabel=(st.murder_notice_button_label||'이용수칙 · 공지 보기').trim()||'이용수칙 · 공지 보기';
    $('murderNoticeBtn').textContent='📌 '+murderNoticeButtonLabel;
    $('murderNoticeBtn').setAttribute('aria-label',murderNoticeButtonLabel);
    $('murderNoticeBtn').classList.remove('is-loading');
    $('murderNoticeTitle').textContent='📌 '+murderNoticeButtonLabel;
    $('murderNoticeDialog').setAttribute('aria-label',murderNoticeButtonLabel);
    syncMurderNotice();
  }
  function syncMurderNotice(){
    const content=$('murderNoticeContent');
    if(!content)return;
    if(murderNotice){content.textContent=murderNotice;content.classList.remove('murder-notice-empty')}
    else{content.textContent='등록된 공지가 없습니다.';content.classList.add('murder-notice-empty')}
  }
  function lockMurderNoticeScroll(){
    const scrollbarWidth=window.innerWidth-document.documentElement.clientWidth;
    murderNoticeScrollPad=document.body.style.paddingRight;
    if(scrollbarWidth>0)document.body.style.paddingRight=scrollbarWidth+'px';
    document.body.classList.add('murder-notice-open');
  }
  function unlockMurderNoticeScroll(){
    document.body.classList.remove('murder-notice-open');
    document.body.style.paddingRight=murderNoticeScrollPad;
  }
  async function refreshMurderNotice(){
    try{
      const rows=await get('/rest/v1/site_settings?select=murder_notice,murder_notice_button_label&id=eq.main&limit=1&_t='+Date.now(),0);
      const st=Array.isArray(rows)&&rows[0]?rows[0]:null;
      if(st)applySettings(st);
    }catch(e){
      console.warn('최신 머더미스터리 공지를 다시 불러오지 못했습니다.',e);
    }
  }
  async function openMurderNotice(){
    const modal=$('murderNoticeModal');
    const btn=$('murderNoticeBtn');
    if(btn)btn.disabled=true;
    await refreshMurderNotice();
    syncMurderNotice();
    if(btn)btn.disabled=false;
    lockMurderNoticeScroll();modal.classList.add('open');modal.setAttribute('aria-hidden','false');
  }
  function closeMurderNotice(){
    const modal=$('murderNoticeModal');modal.classList.remove('open');modal.setAttribute('aria-hidden','true');unlockMurderNoticeScroll();
  }
  $('murderNoticeBtn').addEventListener('click',openMurderNotice);
  $('murderNoticeClose').addEventListener('click',closeMurderNotice);
  $('murderNoticeModal').addEventListener('click',e=>{if(e.target===$('murderNoticeModal'))closeMurderNotice()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMurderNotice()});
  function statusClass(v){return ({'보유':'owned','대여중':'rented','분실':'lost','도트':'dott','공방':'workshop'})[v]||'owned'}
  function playtimeLabel(v){const s=String(v??'').trim();if(!s)return '-';if(/^\d+$/.test(s))return s+'분';if(/^\d+\s*분$/.test(s))return s.replace(/\s+/g,'');return s}
  function filtered(){
    const q=($('q').value||'').trim().toLowerCase();
    const p=Number($('players').value||0);
    const d=$('difficulty').value||'';
    return items.filter(x=>(!q||String(x.name||'').toLowerCase().includes(q))&&(!p||((Number(x.min_players)||0)<=p&&(Number(x.max_players)||99)>=p))&&(!d||x.difficulty===d));
  }
  function row(x){
    const badge=x.genre===ONLINE?'<span class="online-badge">온라인</span>':'';
    const name=String(x.name||'-');
    const note=String(x.note||'-');
    const noteShort=Array.from(note).length>10?Array.from(note).slice(0,10).join('')+'…':note;
    return `<tr><td class="catalog-name"><div class="catalog-name-inner"><span class="catalog-name-text" title="${esc(name)}">${esc(name)}</span>${badge}</div></td><td>${x.min_players||'?'}~${x.max_players||'?'}인</td><td>${esc(playtimeLabel(x.playtime))}</td><td>${esc(x.difficulty||'-')}</td><td><span class="status ${statusClass(x.status)}">${esc(x.status||'-')}</span></td><td class="catalog-owner">${esc(x.location||'-')}</td><td class="catalog-note" title="${esc(note)}"><span class="note-desktop">${esc(note)}</span><span class="note-mobile">${esc(noteShort)}</span></td></tr>`;
  }
  function paint(){
    const list=filtered();
    $('count').textContent=`${list.length}개 표시 중`;
    if(!list.length){$('content').innerHTML='<div class="empty">조건에 맞는 게임이 없습니다.</div>';return;}
    $('content').innerHTML=`<div class="catalog-table-wrap"><table class="catalog-table"><thead><tr><th>게임명</th><th>인원</th><th>시간</th><th>난이도</th><th>상태 및 위치</th><th>소유주</th><th>비고</th></tr></thead><tbody>${list.map(row).join('')}</tbody></table></div>`;
  }
  function setItems(rows){items=Array.isArray(rows)?rows:[];$('total').textContent=`${items.length}개`;paint();}
  ['q','players','difficulty'].forEach(id=>$(id).addEventListener('input',paint));
  let cached=null;try{cached=JSON.parse(localStorage.getItem(CACHE)||'null')}catch(_e){}
  let renderedFromCache=false;

  // Instant first paint:
  // if we already have a previously fetched murder list/settings, paint them synchronously
  // before the browser's first visible frame. Live data is fetched afterward and only repainted
  // when something actually changed, so there is no 'title first -> rest later' double-step.
  if(cached&&Array.isArray(cached.items)){
    if(cached.settings)applySettings(cached.settings);
    setItems(cached.items);
    $('notice').innerHTML='';
    renderedFromCache=true;
  }

  Promise.allSettled([
    get('/rest/v1/catalog_items?select=kind,name,min_players,max_players,playtime,difficulty,genre,status,location,note&kind=eq.murder&order=name.asc'),
    get('/rest/v1/site_settings?select=*&id=eq.main&limit=1')
  ]).then(([games,settings])=>{
    let latestSettings=null;
    if(settings.status==='fulfilled'&&Array.isArray(settings.value)&&settings.value[0]){
      latestSettings=settings.value[0];
      const prevSettings=cached&&cached.settings?cached.settings:null;
      const settingsChanged=!renderedFromCache||JSON.stringify(prevSettings)!==JSON.stringify(latestSettings);
      if(settingsChanged)applySettings(latestSettings);
    }else if(cached&&cached.settings){
      latestSettings=cached.settings;
      if(!renderedFromCache)applySettings(latestSettings);
    }else{
      // No settings were available. Reveal the fallback only now, after the fetch attempt,
      // so an old hard-coded label never flashes during page transition.
      applySettings({murder_description:$('desc').textContent||DEFAULT_DESC,murder_notice:'',murder_notice_button_label:'이용수칙 · 공지 보기'});
    }

    if(games.status==='fulfilled'){
      const liveItems=games.value||[];
      const itemsChanged=!renderedFromCache||JSON.stringify(cached&&cached.items||[])!==JSON.stringify(liveItems);
      if(itemsChanged)setItems(liveItems);
      try{localStorage.setItem(CACHE,JSON.stringify({items:liveItems,settings:latestSettings,ts:Date.now()}))}catch(_e){}
      $('notice').innerHTML='';
    }else if(cached&&Array.isArray(cached.items)){
      setItems(cached.items);
      $('notice').innerHTML='<div class="warn">최신 목록을 불러오지 못해 저장된 목록을 표시합니다.<button class="retry" onclick="location.reload()">다시 시도</button></div>';
    }else{
      $('content').innerHTML='<div class="empty">목록을 불러오지 못했습니다.</div>';
      $('notice').innerHTML='<div class="warn">최신 목록을 불러오지 못했습니다.<button class="retry" onclick="location.reload()">다시 시도</button></div>';
    }
  });
})();
</script>
</body>
