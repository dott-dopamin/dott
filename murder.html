<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>DOTT 머더미스터리</title>
<style>
:root{--bg:#f8f4ec;--paper:#fffdf9;--ink:#2f2a25;--muted:#8d8176;--line:#eadfce;--accent:#e95d20;--accent-soft:#ffe8dc;--green:#43875a;--green-soft:#edf7ef;--red:#a04d4d;--red-soft:#f7eded;--purple:#6d55a0;--purple-soft:#eee7fb}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}button,input,select{font:inherit}
.shell{max-width:1180px;min-height:calc(100vh - 44px);margin:22px auto;background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.topbar{min-height:72px;padding:0 28px;display:flex;align-items:center;gap:20px;border-bottom:1px solid var(--line);background:#fffefa}.brand{display:flex;align-items:center;gap:12px;min-width:220px}.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:900}.brand strong{display:block;font-size:15px}.brand small{display:block;margin-top:2px;font-size:11px;color:var(--muted)}.nav{display:flex;justify-content:center;gap:5px;flex:1}.nav a{padding:10px 12px;border-radius:10px;font-size:14px;color:#5d554d;white-space:nowrap}.nav a.active{background:var(--accent-soft);color:#8d3714;font-weight:700}.admin-link{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 11px;font-size:13px;white-space:nowrap}
.page{padding:46px 30px 60px}.hero{padding:10px 0 30px;border-bottom:1px solid var(--line)}.eyebrow{display:inline-flex;background:#fff4ee;color:#a14118;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700}.hero h1{margin:18px 0 13px;font-size:40px;line-height:1.18;font-weight:500;letter-spacing:-1.6px}.hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.7;white-space:pre-wrap}.stat-row{margin-top:18px}.stat-pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:#fff;padding:7px 10px;font-size:12px}.stat-pill b{margin-left:4px;color:var(--accent)}
.section{margin-top:28px}.filters{display:grid;grid-template-columns:minmax(180px,1.4fr) minmax(120px,.7fr) minmax(140px,.7fr);gap:10px;margin-bottom:16px}.field{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);outline:none}.field:focus{border-color:#dca37e;box-shadow:0 0 0 3px #fde9db}.catalog-meta{margin:0 0 14px;font-size:13px}.catalog-table-wrap{overflow:hidden;border:1px solid var(--line);border-radius:14px;background:#fff}.catalog-table{width:100%;border-collapse:collapse;table-layout:fixed}.catalog-table th,.catalog-table td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:12px;text-align:left;vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.catalog-table th{background:#fbf7f0;color:#756a60;font-size:11px;font-weight:600}.catalog-table tbody tr:last-child td{border-bottom:0}.catalog-table tbody tr:hover{background:#fffaf4}.catalog-table th:nth-child(1),.catalog-table td:nth-child(1){width:27%}.catalog-table th:nth-child(2),.catalog-table td:nth-child(2){width:10%}.catalog-table th:nth-child(3),.catalog-table td:nth-child(3){width:11%}.catalog-table th:nth-child(4),.catalog-table td:nth-child(4){width:11%}.catalog-table th:nth-child(5),.catalog-table td:nth-child(5){width:14%}.catalog-table th:nth-child(6),.catalog-table td:nth-child(6){width:11%}.catalog-table th:nth-child(7),.catalog-table td:nth-child(7){width:16%}.catalog-name{font-weight:600}.catalog-owner,.catalog-note{color:var(--muted)!important;font-weight:400!important}.status{display:inline-flex;padding:4px 7px;border-radius:999px;background:var(--green-soft);color:var(--green);font-size:10.5px;font-weight:700}.status.out{background:var(--red-soft);color:var(--red)}.online-badge{display:inline-flex;margin-left:7px;padding:3px 6px;border-radius:999px;background:var(--purple-soft);color:var(--purple);font-size:9px;font-weight:700;vertical-align:middle}.loading,.empty{padding:40px;text-align:center;color:var(--muted)}.warn{margin-bottom:14px;padding:10px 12px;border:1px solid #ead7c4;border-radius:12px;background:#fff8ef;color:#765c43;font-size:12px;line-height:1.5}.retry{margin-left:8px;border:1px solid #ddc6b0;background:#fff;border-radius:8px;padding:5px 8px;color:#765c43;cursor:pointer}.footer{padding:22px 28px;border-top:1px solid var(--line);background:#fbf3e6;color:#9a9086;font-size:11px;display:flex;justify-content:space-between}
@media(max-width:700px){.shell{margin:0;border-radius:0;border-left:0;border-right:0;min-height:100vh}.topbar{padding:10px 12px 8px;gap:8px 10px;flex-wrap:wrap}.brand{order:1;flex:1 1 auto;min-width:0;gap:9px}.brand-mark{width:34px;height:34px;flex:0 0 34px}.brand strong{font-size:14px}.brand small{font-size:10px}.admin-link{order:2;margin-left:auto;padding:8px 9px;font-size:11px}.nav{order:3;flex:0 0 100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;width:100%}.nav a{padding:8px 2px;text-align:center;font-size:10.5px;overflow:hidden}.page{padding:30px 8px 44px}.hero{padding-left:5px;padding-right:5px}.hero h1{font-size:30px}.filters{grid-template-columns:1fr 1fr;gap:7px}.filters .search{grid-column:1/-1}.field{padding:9px 8px;font-size:11px}.catalog-table-wrap{overflow:hidden}.catalog-table{min-width:0;width:100%;table-layout:fixed}.catalog-table th,.catalog-table td{padding:7px 1px;font-size:7.9px;text-align:center;white-space:nowrap}.catalog-table th{font-size:7.4px;letter-spacing:-.35px}.catalog-table th:nth-child(1),.catalog-table td:nth-child(1){width:28%;text-align:left;padding-left:4px}.catalog-table th:nth-child(2),.catalog-table td:nth-child(2){width:10%}.catalog-table th:nth-child(3),.catalog-table td:nth-child(3){width:10%}.catalog-table th:nth-child(4),.catalog-table td:nth-child(4){width:11%}.catalog-table th:nth-child(5),.catalog-table td:nth-child(5){width:14%}.catalog-table th:nth-child(6),.catalog-table td:nth-child(6){width:11%}.catalog-table th:nth-child(7),.catalog-table td:nth-child(7){width:16%;padding-right:3px}.online-badge{margin-left:2px;padding:2px 3px;font-size:6.3px}.status{padding:2px 3px;font-size:6.8px}.footer{padding:18px 12px}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">D</span><span><strong>DOTT</strong><small>도트 예약 현황</small></span></a>
    <nav class="nav"><a href="index.html">예약 캘린더</a><a href="boardgames.html">보드게임</a><a class="active" href="murder.html">머더미스터리</a><a href="deduction.html">추리게임</a></nav>
    <a class="admin-link" href="admin.html">🔒 관리</a>
  </header>
  <main class="page">
    <section class="hero">
      <span class="eyebrow">🎲 보유 현황</span>
      <h1>머더미스터리 리스트</h1>
      <p id="desc">보유 중인 머더미스터리 시나리오를 한눈에 확인하세요.</p>
      <div class="stat-row"><span class="stat-pill">전체 <b id="total">0개</b></span></div>
    </section>
    <section class="section">
      <div id="notice"></div>
      <div class="filters">
        <input id="q" class="field search" placeholder="게임명 검색">
        <select id="players" class="field"><option value="">인원 전체</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option></select>
        <select id="difficulty" class="field"><option value="">난이도 전체</option><option>입문</option><option>쉬움</option><option>중간</option><option>어려움</option><option>매우어려움</option></select>
      </div>
      <div class="catalog-meta"><span id="count">목록을 불러오는 중...</span></div>
      <div id="content"><div class="loading">목록을 불러오는 중...</div></div>
    </section>
  </main>
  <footer class="footer"><span>📅 DOTT · 예약과 보유 게임을 한눈에</span><span>© 2026 도파민</span></footer>
</div>
<script>
(function(){
  'use strict';
  const API='https://rblwvzokyblnmmdscvsd.supabase.co';
  const KEY='sb_publishable_wp_40b8UIumyLkLhvflzTw_08EaA1wZ';
  const ONLINE='__DOTT_ONLINE_MURDER__';
  const CACHE='dott_murder_v41';
  let items=[];
  const $=id=>document.getElementById(id);
  const esc=(v='')=>String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const delay=ms=>new Promise(r=>setTimeout(r,ms));
  async function get(path,retries=2){
    let last;
    for(let i=0;i<=retries;i++){
      const controller=new AbortController();
      const timer=setTimeout(()=>controller.abort(),10000);
      try{
        const r=await fetch(API+path,{headers:{apikey:KEY},signal:controller.signal,cache:'no-store'});
        const txt=await r.text();
        let data=[]; try{data=txt?JSON.parse(txt):[]}catch{data=txt}
        if(!r.ok)throw new Error((data&&data.message)||`요청 실패 (${r.status})`);
        return data;
      }catch(e){last=e;if(i<retries)await delay(400*(i+1));}
      finally{clearTimeout(timer)}
    }
    throw last||new Error('연결 오류');
  }
  function statusClass(v){return ['대여중','분실'].includes(v)?'out':''}
  function filtered(){
    const q=($('q').value||'').trim().toLowerCase();
    const p=Number($('players').value||0);
    const d=$('difficulty').value||'';
    return items.filter(x=>(!q||String(x.name||'').toLowerCase().includes(q))&&(!p||((Number(x.min_players)||0)<=p&&(Number(x.max_players)||99)>=p))&&(!d||x.difficulty===d));
  }
  function row(x){
    const badge=x.genre===ONLINE?'<span class="online-badge">온라인머미</span>':'';
    return `<tr><td class="catalog-name">${esc(x.name||'-')}${badge}</td><td>${x.min_players||'?'}~${x.max_players||'?'}인</td><td>${esc(x.playtime||'-')}</td><td>${esc(x.difficulty||'-')}</td><td><span class="status ${statusClass(x.status)}">${esc(x.status||'-')}</span></td><td class="catalog-owner">${esc(x.location||'-')}</td><td class="catalog-note">${esc(x.note||'-')}</td></tr>`;
  }
  function paint(){
    const list=filtered();
    $('count').textContent=`${list.length}개 표시 중`;
    if(!list.length){$('content').innerHTML='<div class="empty">조건에 맞는 게임이 없습니다.</div>';return;}
    $('content').innerHTML=`<div class="catalog-table-wrap"><table class="catalog-table"><thead><tr><th>게임명</th><th>인원</th><th>시간</th><th>난이도</th><th>상태 및 위치</th><th>소유주</th><th>비고</th></tr></thead><tbody>${list.map(row).join('')}</tbody></table></div>`;
  }
  function setItems(rows){items=Array.isArray(rows)?rows:[];$('total').textContent=`${items.length}개`;paint();}
  ['q','players','difficulty'].forEach(id=>$(id).addEventListener('input',paint));
  let cached=null;try{cached=JSON.parse(localStorage.getItem(CACHE)||'null')}catch(_e){}
  if(cached&&Array.isArray(cached.items))setItems(cached.items);
  Promise.allSettled([
    get('/rest/v1/catalog_items?select=kind,name,min_players,max_players,playtime,difficulty,genre,status,location,note&kind=eq.murder&order=name.asc'),
    get('/rest/v1/site_settings?select=murder_description&id=eq.main&limit=1')
  ]).then(([games,settings])=>{
    if(games.status==='fulfilled'){
      setItems(games.value||[]);
      try{localStorage.setItem(CACHE,JSON.stringify({items:games.value||[],ts:Date.now()}))}catch(_e){}
      $('notice').innerHTML='';
    }else{
      if(!cached)$('content').innerHTML='<div class="empty">목록을 불러오지 못했습니다.</div>';
      $('notice').innerHTML=`<div class="warn">최신 목록을 불러오지 못했습니다.${cached?' 저장된 목록을 표시합니다.':''}<button class="retry" onclick="location.reload()">다시 시도</button></div>`;
    }
    if(settings.status==='fulfilled'&&Array.isArray(settings.value)&&settings.value[0]?.murder_description)$('desc').textContent=settings.value[0].murder_description;
  });
})();
</script>
</body>
</html>
