<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>DOPAMIN MYSTERY · 수요일의 일격 | 8개 증거 카드 테스트</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;padding:0}
body{background:#121724;color:#f3f0eb}
button,select,input{font:inherit}
button{cursor:pointer}
.preview-toolbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px max(18px,calc((100vw - 1050px)/2));background:rgba(17,22,34,.97);border-bottom:1px solid #384255;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.preview-brand{font-size:13px;font-weight:800;letter-spacing:-.02em;color:#f4d8ac}
.preview-tag{display:inline-block;margin-left:7px;border:1px solid #786c5f;border-radius:99px;padding:3px 7px;color:#cfb690;font-size:10px;vertical-align:middle}
.preview-clear{border:1px solid #78635d;border-radius:10px;background:#2d3544;color:#f7e7d5;padding:9px 12px;font-size:12px;font-weight:700}
.preview-clear:hover{background:#414d60}
.preview-toolbar .preview-note{font-size:11px;font-weight:500;color:#b2bfd0;margin-top:4px}
.preview-footer{border-top:1px solid #384255;text-align:center;color:#8fa1b8;font-size:12px;padding:25px 15px;line-height:1.65}
.preview-footer strong{color:#e2b78e}
.preview-toolbar a{color:#e8c69b;text-decoration:underline}
@media(max-width:650px){.preview-toolbar{padding:10px 14px}.preview-brand{font-size:12px}.preview-tag{font-size:9px}.preview-clear{padding:8px 10px;font-size:11px}}

/* DOTT original solo mystery – scoped game styles */
.mystery-wrap{min-height:650px;background:#171c2a;color:#edf0f6;position:relative;overflow:hidden}
.mystery-wrap::before{content:"";position:absolute;inset:-100px -70px auto auto;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(169,90,108,.17),transparent 70%);pointer-events:none}
.mystery-content{max-width:1050px;padding:44px 28px 64px;margin:0 auto;position:relative;z-index:1}
.mystery-kicker{font-size:11px;font-weight:800;letter-spacing:.16em;color:#dbb98b;text-transform:uppercase}
.mystery-title{font-size:clamp(30px,5.5vw,56px);font-weight:800;letter-spacing:-1.5px;margin:14px 0 13px;color:#fff;line-height:1.18}
.mystery-lead{font-size:15px;color:#c1c7d5;line-height:1.8;max-width:680px;margin:0 0 24px;word-break:keep-all}
.mystery-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.mystery-pill{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border:1px solid #454a5b;color:#e3d6c5;background:#242a39;border-radius:999px;font-size:12px}
.mystery-panel{border:1px solid #3c4355;border-radius:20px;background:linear-gradient(145deg,rgba(45,51,68,.96),rgba(31,37,52,.98));padding:23px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.mystery-panel h2,.mystery-panel h3{color:#fff;margin:0 0 12px}
.mystery-panel h2{font-size:24px}.mystery-panel h3{font-size:17px}
.mystery-panel p{margin:8px 0;color:#cdd1db;line-height:1.85}
.mystery-grid{display:grid;grid-template-columns:1.38fr .72fr;gap:18px}
.mystery-card{display:flex;flex-direction:column;gap:12px;min-height:240px}
.mystery-case-symbol{height:105px;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#674454,#272b3b 65%);border:1px solid #61545e;border-radius:14px;font-size:45px}
.mystery-btn{border-radius:11px;padding:12px 17px;border:1px solid #6d6471;background:#353c4d;color:#f3f1f2;font-size:14px;font-weight:700;display:inline-flex;justify-content:center;align-items:center;gap:8px;transition:background .15s,transform .15s}
.mystery-btn:hover{background:#464e61}.mystery-btn:focus-visible,.mystery-tab:focus-visible,.mystery-item:focus-visible{outline:3px solid #dfba85;outline-offset:2px}
.mystery-btn:active{transform:translateY(1px)}
.mystery-btn-primary{background:#ba8a5e;border-color:#ba8a5e;color:#1b1d25}.mystery-btn-primary:hover{background:#d4aa7a}
.mystery-btn-danger{border-color:#69505b;background:#513642}
.mystery-btn:disabled{opacity:.45;cursor:not-allowed}
.mystery-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.mystery-section-title{font-weight:800;color:#f7e7d0;letter-spacing:-.3px;font-size:17px;margin:0 0 13px}
.mystery-story{padding:22px;background:rgba(9,12,21,.42);border-left:3px solid #b99066;border-radius:0 12px 12px 0;line-height:2;color:#e5e7ed;white-space:pre-line;word-break:keep-all}
.mystery-subtle{color:#aeb6c7;font-size:13px;line-height:1.65}
.mystery-progress{height:7px;background:#40485a;border-radius:20px;overflow:hidden;margin:9px 0 24px}
.mystery-progress>span{display:block;height:100%;background:linear-gradient(90deg,#ad7857,#e2bd8a);transition:width .25s}
.mystery-tabs{display:flex;gap:8px;margin:18px 0 17px;overflow:auto;padding-bottom:5px}
.mystery-tab{border:1px solid #465065;background:#242b3b;color:#d1d6df;padding:11px 15px;white-space:nowrap;border-radius:10px;font-size:13px;font-weight:750}
.mystery-tab.active{background:#d0a779;border-color:#d0a779;color:#1c2330}
.mystery-item-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:13px}
.mystery-item{width:100%;text-align:left;border:1px solid #475062;background:#2a3243;border-radius:13px;padding:15px;color:#eaeef4;display:flex;flex-direction:column;gap:7px;min-height:112px}
.mystery-item:hover{border-color:#d6ad7d;background:#364052}
.mystery-item.done{border-color:#648b7a;background:#2c413d}
.mystery-item .mystery-emoji{font-size:26px}
.mystery-item strong{font-size:14px}.mystery-item small{color:#b9c1d1;line-height:1.5}
.mystery-room-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.mystery-room{border:1px solid #50586b;border-radius:999px;color:#e5e8ee;background:#232b3b;padding:8px 14px;font-size:13px;font-weight:700}
.mystery-room.active{border-color:#d9aa75;background:#4a3d39}
.mystery-note{padding:16px;border:1px solid #4a5365;border-radius:12px;background:#222938;margin:12px 0}
.mystery-note strong{display:block;color:#e6c392;margin-bottom:7px;font-size:15px}.mystery-note p{margin:0;color:#d4dbe5;font-size:14px}
.mystery-evidence{border:1px solid #544d59;background:#312e3b;border-radius:12px;padding:18px;margin-top:17px}
.mystery-evidence h3{color:#e9c99a;margin:0 0 9px;font-size:16px}
.mystery-evidence p{color:#e6dbe0;margin:0 0 14px}
.mystery-suspect-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.mystery-suspect{border:1px solid #475062;border-radius:13px;background:#2a3141;color:#e6eaf1;text-align:left;padding:14px;min-height:105px}
.mystery-suspect.active{border-color:#d3a878;background:#4b3e3c}
.mystery-suspect span{display:block;font-size:25px;margin-bottom:7px}
.mystery-suspect strong{font-size:15px}
.mystery-suspect small{display:block;margin-top:3px;font-size:12px;color:#bec5d2}
.mystery-field{display:flex;flex-direction:column;gap:8px;margin:18px 0;color:#f1e3d3;font-weight:750;font-size:14px}
.mystery-field select{border:1px solid #70778b;border-radius:10px;padding:12px;background:#282f41;color:#fff;width:100%;font-size:14px}
.mystery-highlight{color:#e8bf8b;font-weight:800}
.mystery-warning{border:1px solid #8c6c53;background:#4f3b32;border-radius:12px;padding:12px 15px;color:#f5e0c5;margin:14px 0;font-size:13px;line-height:1.65}
.mystery-success{border:1px solid #588775;background:#29463d;border-radius:12px;padding:12px 15px;color:#d4f4e7;margin:14px 0;font-size:13px;line-height:1.65}
.mystery-result-score{font-size:34px;font-weight:900;color:#f5ca94;margin:12px 0}
.mystery-divider{height:1px;background:#434b5e;margin:20px 0}
.mystery-footer-note{margin-top:22px;font-size:12px;color:#a1acbb}
@media(max-width:780px){.mystery-content{padding:29px 15px 46px}.mystery-grid{grid-template-columns:1fr}.mystery-panel{padding:17px}.mystery-item-grid{grid-template-columns:1fr 1fr}.mystery-title{letter-spacing:-.5px}.mystery-suspect-list{gap:6px}.mystery-suspect{padding:9px}.mystery-suspect strong{font-size:13px}.mystery-suspect small{font-size:11px}}
@media(max-width:380px){.mystery-item-grid{grid-template-columns:1fr}.mystery-tabs{gap:5px}.mystery-tab{padding:9px 10px;font-size:12px}}
@media(prefers-reduced-motion:reduce){.mystery-progress>span,.mystery-btn{transition:none}}

/* Wednesday case: four suspects visible on desktop; two per row on mobile */
.mystery-suspect-list{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:780px){.mystery-suspect-list{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Investigation notebook: evidence-gated chronology */
.mystery-timeline{border:1px solid #495366;border-radius:13px;overflow:hidden;margin:14px 0 22px;background:#232b3a}
.mystery-timeline-row{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;align-items:start;padding:11px 14px;border-top:1px solid #414a5c;line-height:1.5;font-size:13px}
.mystery-timeline-row:first-child{border-top:0}
.mystery-timeline-row time{font-variant-numeric:tabular-nums;font-weight:800;color:#e2ba83;white-space:nowrap}
.mystery-timeline-row span{color:#d3dae5;overflow-wrap:anywhere;word-break:keep-all}
@media(max-width:390px){.mystery-timeline-row{grid-template-columns:78px minmax(0,1fr);gap:8px;padding:10px;font-size:12px}}

/* Case 001 — eight evidence image-style exhibits, four per round */
.mystery-stage-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.mystery-stage-head .mystery-section-title{margin:4px 0 0}
.mystery-stage-count{font-size:13px;font-weight:800;color:#f6d5a4;border:1px solid #6d5d4c;border-radius:99px;padding:7px 12px;white-space:nowrap}
.evidence-card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:22px 0}
.evidence-card{display:block;text-align:left;border:1px solid #535a69;border-radius:16px;overflow:hidden;background:#293141;color:#fff;padding:0;min-width:0;transition:transform .15s,border-color .15s,box-shadow .15s}
.evidence-card:hover{transform:translateY(-2px);border-color:#d3ae82;box-shadow:0 14px 35px rgba(0,0,0,.18)}
.evidence-card:focus-visible{outline:3px solid #e7be85;outline-offset:3px}
.evidence-card.evidence-collected{border-color:#769b86}
.evidence-card-copy{padding:13px 15px 16px;min-height:153px}
.evidence-card-copy strong{font-size:15px;font-weight:850;color:#fff}
.mystery-panel .evidence-card-copy p{font-size:12px;line-height:1.55;color:#bdc6d3;margin:7px 0 12px;min-height:37px;word-break:keep-all}
.evidence-card-status{font-size:11px;font-weight:800;color:#f4c389}
.evidence-collected .evidence-card-status{color:#98d1b2}
.evidence-detail{border:1px solid #b89267;border-radius:15px;padding:17px;background:#262d3b;margin:12px 0 20px}
.evidence-detail h3{color:#fff;margin:6px 0 14px}
.mystery-panel .evidence-detail p{font-size:14px;line-height:1.85;margin:16px 0;color:#e1e4ea;word-break:keep-all}
.evidence-detail .evidence-art{max-width:650px;height:280px;margin:0 auto}
.evidence-art{height:205px;width:100%;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 45%,#75665e,#363b48 75%);font-family:inherit;isolation:isolate}
.evidence-art:before{content:"";position:absolute;inset:0;opacity:.15;background:repeating-linear-gradient(0deg,transparent 0 5px,rgba(0,0,0,.35) 5px 6px);pointer-events:none}
.ev-photo-label{position:absolute;bottom:9px;left:11px;background:#151a25b8;color:#e5d5c3;padding:4px 7px;border-radius:4px;font:800 10px/1 monospace;letter-spacing:.08em;z-index:2}
.ev-object{position:relative;box-shadow:0 12px 20px #1116;z-index:1}
.evidence-art--da-note{background:radial-gradient(circle,#6c625c,#3e3a40)}
.ev-paper{width:67%;max-width:300px;min-height:164px;background:#e6dcc1;color:#574b39;transform:rotate(-7deg);padding:16px 18px 22px;border-radius:2px;clip-path:polygon(0 0,100% 0,100% 90%,96% 94%,91% 90%,85% 97%,77% 91%,70% 98%,63% 92%,54% 100%,46% 93%,38% 97%,30% 93%,22% 98%,15% 92%,8% 96%,0 92%);box-shadow:0 9px 18px #1118}
.ev-paper-top{font-size:13px;font-weight:900;border-bottom:1px solid #ab9a80;padding-bottom:7px}
.ev-paper-top span{float:right;font:700 11px monospace}
.ev-paper-lines{font-size:12px;line-height:1.7;margin-top:9px;color:#786956}
.ev-paper-hand{font-size:13px;color:#9b453e;font-weight:900;line-height:1.45;transform:rotate(-3deg);margin-top:7px;word-break:keep-all}
.evidence-art--prints{background:radial-gradient(circle,#6b6e70,#2a3541)}
.ev-metal{width:64%;height:116px;background:linear-gradient(120deg,#bfc3bd,#7a8389 52%,#b4b6b3);border:5px solid #69737c;border-radius:9px;transform:perspective(400px) rotateY(-12deg) rotateZ(4deg);color:#27313e;text-align:center}
.ev-metal-top{font:900 11px monospace;padding-top:11px;letter-spacing:2px}
.ev-metal-lock{margin:9px auto 0;width:72px;height:20px;border:3px solid #596269;background:#d2d4d0;border-radius:3px}
.ev-print{position:absolute;right:-13px;top:20px;border:2px dashed #ffd482;background:#253342bd;color:#fff;border-radius:99px;width:62px;height:62px;display:grid;place-items:center;font-size:39px;transform:rotate(18deg)}
.ev-metal-foot{font:800 10px monospace;letter-spacing:1px;margin-top:8px}
.evidence-art--spray{background:linear-gradient(135deg,#5e5650,#272e3a)}
.ev-chair{position:absolute;top:-60px;width:75%;height:170px;border-radius:50%;background:#4f4541;box-shadow:0 18px 20px #15141a88;transform:rotate(-12deg)}
.ev-bottle{width:78px;height:132px;border-radius:15px 15px 19px 19px;background:linear-gradient(90deg,#d9e4d5,#fff,#abbfae);transform:rotate(29deg) translate(3px,13px);border:2px solid #d2e0d3;padding:34px 6px 12px}
.ev-nozzle{position:absolute;top:-30px;left:20px;height:32px;width:29px;background:#dddde3;border-radius:3px}
.ev-nozzle:after{content:"";position:absolute;left:15px;top:2px;width:28px;height:8px;background:#e8e9eb;border-radius:3px}
.ev-bottle-label{background:#a9c9ab;color:#305340;border-radius:5px;font-size:15px;font-weight:900;padding:9px 2px;text-align:center;line-height:1.25}
.ev-bottle-label small{display:block;font-size:10px;margin-top:3px}
.ev-note-yellow{position:absolute;right:7%;top:48%;padding:8px 10px;background:#e7c96f;color:#5f3c25;font-size:12px;font-weight:900;line-height:1.4;transform:rotate(-9deg);box-shadow:0 5px 12px #1016}
.evidence-art--receipt{background:radial-gradient(circle,#77766c,#383945)}
.ev-receipt{width:195px;max-width:77%;background:#f2ebdb;color:#333;transform:rotate(5deg);padding:15px 16px 22px;font:700 11px/2 monospace;clip-path:polygon(0 0,100% 0,100% 96%,94% 100%,86% 96%,78% 100%,70% 96%,62% 100%,54% 96%,46% 100%,38% 96%,30% 100%,22% 96%,14% 100%,6% 96%,0 100%)}
.ev-center{text-align:center;font-size:12px;font-weight:900}
.ev-dashed{border-bottom:1px dashed #8e8579;margin:8px 0}
.ev-obscured{background:#ccc5bb;filter:blur(1px)}
.ev-barcode{text-align:center;font-size:21px;letter-spacing:2px;line-height:1.2;margin-top:12px}
.evidence-art--call{background:radial-gradient(circle,#53677b,#1d283a)}
.ev-laptop{width:74%;height:125px;box-shadow:none}
.ev-display{background:linear-gradient(135deg,#283e58,#1e2838);height:108px;border:6px solid #a2a5a6;border-radius:8px 8px 4px 4px;position:relative;overflow:hidden}
.ev-display-top{position:absolute;top:4px;left:8px;color:#c1d5e9;font-size:10px}
.ev-face{width:51px;height:61px;border-radius:50% 50% 15% 15%;background:#7187a3;position:absolute;left:43%;top:32%;font-size:0}
.ev-face:before{content:"";position:absolute;width:36px;height:38px;left:8px;top:-14px;background:#bdac9e;border-radius:50%;box-shadow:0 -9px 0 #26232b}
.ev-time{position:absolute;right:7px;bottom:7px;font:900 14px monospace;color:#f9d8a5}
.ev-sound{position:absolute;left:9px;bottom:5px;color:#f5a8aa;letter-spacing:2px;font-size:15px}
.ev-keyboard{height:13px;background:#adb5bf;border-radius:2px 2px 30% 30%;width:118%;margin-left:-9%}
.ev-small-evidence,.ev-photo-tag{position:absolute;right:5%;bottom:23px;border:1px solid #d7b8867d;border-radius:5px;background:#181e2dd9;color:#f1d7ad;font:800 11px monospace;padding:7px;z-index:2}
.evidence-art--warehouse{background:radial-gradient(circle,#55616d,#283244)}
.ev-cctv{position:relative;width:82%;height:150px;border:7px solid #121e29;background:linear-gradient(45deg,#838a8e,#535d68);color:#f4f8f5;box-shadow:0 12px 20px #14161b9c;overflow:hidden}
.ev-cctv:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 4px,#151c2936 4px 5px)}
.ev-cctv-head{position:absolute;top:6px;left:8px;font:900 11px monospace;z-index:1}
.ev-door-shape{height:125px;width:83px;background:#384553;border:4px solid #242e38;position:absolute;left:40%;top:29px}
.ev-door-shape span{position:absolute;top:14px;left:15px;font:900 13px monospace}
.ev-cctv-times{position:absolute;bottom:7px;left:7px;right:7px;display:flex;justify-content:space-between;font:900 10px monospace}
.ev-photo-tag{bottom:14px;right:2%;font-size:10px}
.evidence-art--group{background:radial-gradient(circle,#807464,#3a3440)}
.ev-photo{width:73%;height:142px;background:#e6ded0;padding:12px;border:8px solid #eee6d9;transform:rotate(-5deg);color:#393c40}
.ev-photo-title{font:900 12px monospace}
.ev-photo-desk{height:75px;background:linear-gradient(140deg,#8c644b,#6e5043);border-radius:6px;position:relative;margin-top:7px}
.ev-mini-box{position:absolute;width:80px;height:45px;background:#b8b8ac;border:4px solid #64696c;left:14%;top:18px;border-radius:4px}
.ev-mini-spray{position:absolute;width:13px;height:29px;background:#e8e6d8;border-radius:5px;left:67%;top:20px}
.ev-red-ring{border:3px solid #d6524b;width:52px;height:52px;border-radius:50%;position:absolute;left:64%;top:44px}
.ev-photo-caption{font-size:10px;letter-spacing:1px;text-align:right;margin-top:4px}
.evidence-art--gatevideo{background:radial-gradient(circle,#536477,#222a38)}
.ev-exit{width:81%;height:148px;background:linear-gradient(130deg,#819097,#323d4c)}
.ev-cctv-person{position:absolute;top:35px;left:36%;width:61px;height:100px}
.ev-cctv-person span{display:block;background:#1a252f;width:33px;height:33px;border-radius:50%;margin:auto;font-size:0}
.ev-cctv-person i{display:block;background:#1a252f;width:60px;height:75px;margin:-2px auto;border-radius:24px 24px 4px 4px;transform:skew(-8deg)}
.ev-payment{position:absolute;bottom:12px;right:4%;background:#ebe8de;border:2px solid #adb8b8;color:#333;transform:rotate(-5deg);padding:7px 10px;z-index:2;font:900 11px monospace;box-shadow:0 5px 9px #1117}
.ev-payment strong,.ev-payment small{display:block;font-size:10px}
@media(max-width:640px){.evidence-card-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.evidence-card-copy{padding:10px;min-height:175px}.evidence-card-copy strong{font-size:13px}.mystery-panel .evidence-card-copy p{font-size:11px;min-height:55px}.evidence-art{height:150px}.evidence-detail .evidence-art{height:230px}.ev-paper{width:80%;padding:10px 12px;min-height:128px}.ev-paper-lines{font-size:9px}.ev-paper-hand{font-size:11px}.ev-paper-top{font-size:11px}.ev-cctv-times{font-size:8px}.ev-photo-label{font-size:9px}.ev-note-yellow{font-size:10px}.ev-payment{right:1%;font-size:9px}}
@media(max-width:360px){.evidence-card-grid{grid-template-columns:1fr}.evidence-card-copy{min-height:auto}.mystery-panel .evidence-card-copy p{min-height:auto}}
</style>
</head>
<body class="mystery-page">
<header class="preview-toolbar" aria-label="독립 테스트 안내">
  <div><div class="preview-brand">🔎 DOPAMIN MYSTERY <span class="preview-tag">TEST ONLY</span></div>

      '<div class="mystery-story">범인은 박지훈이었다.\n\n처음에는 네 사람 모두 의심스러웠다. 20시 49분 허다은은 캘박 누락 문제로 한철과 다투고 “캘박은 안 하시면서 도트는 왜 오세요?”라는 글이 적힌 일정표를 보여줬다. 피해자 의자 아래에서 발견된 찢긴 일정표가 바로 그것이었다. 하지만 20시 58분 12초 현장 쪽 충격음이 들릴 때 다은은 옆 회의실의 연속 화상통화 화면에 있었다.\n\n손승민의 지문은 실제로 범행에 쓰인 금속 카드함 손잡이에 있었다. 그러나 그는 20시 45분 그 카드함을 정모실로 옮겼고 당시 촬영 사진에 손잡이를 쥔 모습이 남았다. 이후 20시 53분 04초부터 21시 02분 06초까지 출구 하나뿐인 창고에 있었음이 문 센서와 복도 영상으로 검증됐다.\n\n서제이의 이름이 붙은 탈취제는 회장 의자 아래에서 발견돼 수상했다. 하지만 20시 50분 단체사진에도 같은 병이 정모실 책상 위에 있었다. 제이는 20시 55분 건물 밖으로 나가 21시 02분 30초 돌아온 사실이 출입 로그와 얼굴이 찍힌 CCTV로 확인됐다.\n\n박지훈은 다음 날 출근을 앞두고도 본게임을 밤 11시 10분에 시작하겠다는 회장의 공지에 화가 났다. 그는 20시 55분부터 편의점에 있었다고 주장하면서 20시 57분 결제 영수증을 내보였다. 하지만 그것은 위치를 증명하지 못하는 모바일 선결제였다.\n\n20시 58분 12초 무렵 정모실에서 장한철과 언쟁하던 지훈은 책상에 놓인 무거운 금속 카드 보관함으로 그를 때렸다. 회의실 통화 녹음에는 20시 58분 12초 충격음이, 피해자의 스마트워치에는 20시 58분 13초 충격 움직임이 남았다. 감식 자료에서도 머리 측면 타박과 보관함 모서리의 형태가 부합했다.\n\n결정적인 사실은 20시 59분 06초 박지훈 본인이 도트 안에서 주출입구로 나오는 모습이 CCTV에 찍혔다는 것이다. “20시 55분부터 편의점에 있었다”는 진술과 절대 양립할 수 없다. 그는 건물을 빠져나가 21시 04분 편의점에서 선결제 상품을 수령하고 21시 06분 35초에 돌아왔다.\n\n다른 세 사람의 독립적으로 확인되는 알리바이와 현장 자료를 종합하면, 기록과 일치하는 유일한 가해자는 박지훈이다.\n\n의식을 되찾은 장한철은 정모실을 둘러보고 말했다.\n“...그럼 오늘 벙은 몇 시에 시작해?”\n\n도파민 일동: “회장님 제발요!!!!”</div>'+
      '<div class="mystery-divider"></div><h3>범인처럼 보였던 다른 세 사람</h3>'+
      note('허다은 · 찢긴 일정표','피해자 옆에 남은 분노의 메모는 사실이지만, 회의실 화상통화로 범행 시각의 위치가 검증된다.')+
      note('손승민 · 금속 보관함의 지문','손잡이를 만진 건 사실이지만 20시 45분의 정상적인 이동 과정에서 남겼을 수 있다. 창고 출입 기록이 별도로 존재한다.')+
      note('서제이 · 탈취제와 손글씨','피해자 의자 근처의 물건이지만 20시 50분 사진에 이미 등장한다. 사건 당시 건물 밖에 있었다.')+
      '<div class="mystery-divider"></div><h3>최종 정답</h3>'+
      '<p>범인: <span class="mystery-highlight">박지훈</span></p>'+
      '<p>동기: <span class="mystery-highlight">밤 11시 이후로 밀리는 벙 시작에 대한 불만</span></p>'+
      '<p>도구: <span class="mystery-highlight">정모실에 미리 놓인 금속 카드 보관함</span></p>'+
      '<p>핵심 증거: <span class="mystery-highlight">20시 59분 06초 박지훈 본인의 퇴실 CCTV</span></p>'+
      '<p class="mystery-subtle">중요: 거짓말을 했다는 사실만으로 공격자를 확정하는 것은 아닙니다. 다른 세 사람의 독립 알리바이, 사건 시각의 교차 기록, 범행 도구와 부상 소견을 함께 대조해야 합니다. 이 게임의 시설 및 기록은 가상의 설정입니다.</p>'+
      '<div class="mystery-actions">'+button('restart','처음부터 다시 수사','mystery-btn-primary')+button('home','사건 목록으로')+'</div></div>';
  }
  function render(){
    const html=({home,intro,play,result}[ui.view]||home)();
    app.innerHTML=nav('mystery')+'<main class="mystery-wrap"><div class="mystery-content">'+html+'</div></main>'+footer();
  }
  function tabChange(id){
    if(!['investigate','interview','notebook','final'].includes(id))return;
    ui.tab=id;ui.selectedClue=null;ui.feedback='';
    if(id==='interview'&&!state.interviewed.includes(ui.suspect)){
      state.interviewed.push(ui.suspect);save();
    }
    render();
  }
  app.addEventListener('click',e=>{
    const el=e.target.closest('[data-action]');
    if(!el||!app.contains(el))return;
    const action=el.dataset.action,id=el.dataset.id;
    if(action==='home')ui.view='home';
    else if(action==='intro')ui.view='intro';
    else if(action==='start'){if(state.submitted){if(!window.confirm('기존 수사 결과를 지우고 처음부터 다시 할까요?'))return;state=defaults();}state.started=true;save();ui.view='play';ui.tab='investigate';}
    else if(action==='resume')ui.view=state.submitted?'result':'play';
    else if(action==='tab'){tabChange(id);return;}
    else if(action==='clue'){
      const item=clues.find(c=>c.id===id);if(!item||item.phase!==state.phase)return;
      if(!state.clues.includes(id)){state.clues.push(id);save();}
      ui.selectedClue=id;
    }
    else if(action==='unlock-round2'){if(!canUnlockRound2())return;state.phase=2;save();ui.tab='investigate';ui.selectedClue=null;ui.feedback='';}
    else if(action==='suspect'){
      if(!suspectIds.has(id))return;
      ui.suspect=id;ui.feedback='';
      if(!state.interviewed.includes(id)){state.interviewed.push(id);save();}
    }
    else if(action==='notebook'){ui.tab='notebook';ui.feedback='';}
    else if(action==='present'){
      const evidence=document.getElementById('mystery-claim')?.value;
      if(!evidence)ui.feedback='증거를 선택해주세요.';
      else if(!state.clues.includes(evidence))ui.feedback='아직 확보하지 않은 증거입니다.';
      else if(ui.suspect==='jihoon'&&evidence==='gatevideo'){
        ui.feedback='🔎 모순 발견! 박지훈은 20시 55분부터 편의점에 있었다고 했지만, 20시 59분 06초 도트에서 직접 나가는 영상이 있습니다. 20시 57분 승인은 모바일 선결제였어요.';
        if(!state.contradictions.includes('jihoon')){state.contradictions.push('jihoon');save();}
      }else if(ui.suspect==='jihoon'&&evidence==='receipt'){
        ui.feedback='20시 57분 승인 시각은 확인됩니다. 하지만 접힌 부분의 결제 방식과 실제 이동 기록은 아직 확인되지 않았습니다.';
      }else if(ui.suspect==='daeun'&&evidence==='da-note'){
        ui.feedback='허다은: “캘박은 안 하시면서 도트는 왜 오세요? 이거 제가 쓴 거 맞아요. 일정이 꼬여서 화났어요. 종이는 회장님이 갖고 가셨는데요!”';
      }else if(ui.suspect==='daeun'&&evidence==='call'){
        ui.feedback='🔎 화상통화 원본에서 20시 58분 12초 충격음 직후에도 허다은은 회의실 화면에서 실시간 답변하고 있었습니다.';
      }else if(ui.suspect==='seungmin'&&evidence==='prints'){
        ui.feedback='손승민: “카드함 평소에 제가 옮기는데 지문이 없으면 그게 더 이상하죠!” 언제 손잡이를 만졌는지가 중요합니다.';
      }else if(ui.suspect==='seungmin'&&evidence==='warehouse'){
        ui.feedback='🔎 손승민은 20시 45분 카드함을 옮겼고, 20시 53분부터 21시 02분까지 창고 밖으로 나온 기록이 없습니다.';
      }else if(ui.suspect==='jei'&&evidence==='spray'){
        ui.feedback='서제이: “탈취제는 제 거 맞아요. 근데 왜 의자 밑에 있죠? 저는 책상 쪽에 뒀는데요?”';
      }else if(ui.suspect==='jei'&&evidence==='group'){
        ui.feedback='🔎 20시 50분 사진에는 탈취제가 이미 정모실에 있고, 출입 영상은 서제이가 사건 당시 건물 밖에 있었음을 뒷받침합니다.';
      }else ui.feedback='이 증거는 그 사람의 동기나 현장 상태를 보여주지만, 지금 선택한 진술을 직접 뒤집지는 못합니다.';
    }
    else if(action==='submit'){
      if(!canSubmit())return;
      const person=document.getElementById('mystery-answer-person')?.value;
      const motive=document.getElementById('mystery-answer-motive')?.value;
      const weapon=document.getElementById('mystery-answer-weapon')?.value;
      const evidence=document.getElementById('mystery-answer-evidence')?.value;
      if(!person||!motive||!weapon||!evidence)ui.feedback='범인, 동기, 사용한 물건, 핵심 증거까지 모두 선택해주세요.';
      else if(!suspectIds.has(person)||!['calendar','climbing','late','smoking'].includes(motive)||!['metalbox','clock','mug','book'].includes(weapon)||!state.clues.includes(evidence)){ui.feedback='선택 항목 중 확인되지 않은 내용이 있습니다. 수사 기록을 다시 확인해주세요.';}
      else {state.submitted=true;state.answer={person,motive,weapon,evidence};save();ui.view='result';ui.feedback='';}
    }
    else if(action==='restart'){
      if(!window.confirm('기존 수사 기록을 지우고 처음부터 다시 할까요?'))return;
      state=defaults();save();ui.view='intro';ui.tab='investigate';ui.room='정모실';ui.suspect='daeun';ui.selectedClue=null;ui.feedback='';
    }else return;
    render();
  });
  render();
})();</script>
</body>
</html>
