<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>DOPAMIN MYSTERY · 수요일의 일격 | 독립 테스트</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;padding:0}
body{background:#121724;color:#f3f0eb}
button,select,input{font:inherit}
button{cursor:pointer}
.preview-toolbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px max(18px,calc((100vw - 1050px)/2));background:rgba(17,22,34,.97);border-bottom:1px solid #384255;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.preview-brand{font-size:13px;font-weight:800;letter-spacing:-.02em;color:#f4d8ac}
.preview-tag{display:inline-block;margin-left:7px;border:1px solid #786c5f;border-radius:99px;padding:3px 7px;color:#cfb690;font-size:10px;vertical-align:middle}
.preview-clear{border:1px solid #78635d;border-radius:10px;background:#2d3544;color:#f7e7d5;padding:9px 12px;font-size:12px;font-weight:700}
.preview-clear:hover{background:#414d60}
.preview-toolbar .preview-note{font-size:11px;font-weight:500;color:#b2bfd0;margin-top:4px}
.preview-footer{border-top:1px solid #384255;text-align:center;color:#8fa1b8;font-size:12px;padding:25px 15px;line-height:1.65}
.preview-footer strong{color:#e2b78e}
.preview-toolbar a{color:#e8c69b;text-decoration:underline}
@media(max-width:650px){.preview-toolbar{padding:10px 14px}.preview-brand{font-size:12px}.preview-tag{font-size:9px}.preview-clear{padding:8px 10px;font-size:11px}}

/* DOTT original solo mystery – scoped game styles */
.mystery-wrap{min-height:650px;background:#171c2a;color:#edf0f6;position:relative;overflow:hidden}
.mystery-wrap::before{content:"";position:absolute;inset:-100px -70px auto auto;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(169,90,108,.17),transparent 70%);pointer-events:none}
.mystery-content{max-width:1050px;padding:44px 28px 64px;margin:0 auto;position:relative;z-index:1}
.mystery-kicker{font-size:11px;font-weight:800;letter-spacing:.16em;color:#dbb98b;text-transform:uppercase}
.mystery-title{font-size:clamp(30px,5.5vw,56px);font-weight:800;letter-spacing:-1.5px;margin:14px 0 13px;color:#fff;line-height:1.18}
.mystery-lead{font-size:15px;color:#c1c7d5;line-height:1.8;max-width:680px;margin:0 0 24px;word-break:keep-all}
.mystery-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.mystery-pill{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border:1px solid #454a5b;color:#e3d6c5;background:#242a39;border-radius:999px;font-size:12px}
.mystery-panel{border:1px solid #3c4355;border-radius:20px;background:linear-gradient(145deg,rgba(45,51,68,.96),rgba(31,37,52,.98));padding:23px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.mystery-panel h2,.mystery-panel h3{color:#fff;margin:0 0 12px}
.mystery-panel h2{font-size:24px}.mystery-panel h3{font-size:17px}
.mystery-panel p{margin:8px 0;color:#cdd1db;line-height:1.85}
.mystery-grid{display:grid;grid-template-columns:1.38fr .72fr;gap:18px}
.mystery-card{display:flex;flex-direction:column;gap:12px;min-height:240px}
.mystery-case-symbol{height:105px;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#674454,#272b3b 65%);border:1px solid #61545e;border-radius:14px;font-size:45px}
.mystery-btn{border-radius:11px;padding:12px 17px;border:1px solid #6d6471;background:#353c4d;color:#f3f1f2;font-size:14px;font-weight:700;display:inline-flex;justify-content:center;align-items:center;gap:8px;transition:background .15s,transform .15s}
.mystery-btn:hover{background:#464e61}.mystery-btn:focus-visible,.mystery-tab:focus-visible,.mystery-item:focus-visible{outline:3px solid #dfba85;outline-offset:2px}
.mystery-btn:active{transform:translateY(1px)}
.mystery-btn-primary{background:#ba8a5e;border-color:#ba8a5e;color:#1b1d25}.mystery-btn-primary:hover{background:#d4aa7a}
.mystery-btn-danger{border-color:#69505b;background:#513642}
.mystery-btn:disabled{opacity:.45;cursor:not-allowed}
.mystery-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.mystery-section-title{font-weight:800;color:#f7e7d0;letter-spacing:-.3px;font-size:17px;margin:0 0 13px}
.mystery-story{padding:22px;background:rgba(9,12,21,.42);border-left:3px solid #b99066;border-radius:0 12px 12px 0;line-height:2;color:#e5e7ed;white-space:pre-line;word-break:keep-all}
.mystery-subtle{color:#aeb6c7;font-size:13px;line-height:1.65}
.mystery-progress{height:7px;background:#40485a;border-radius:20px;overflow:hidden;margin:9px 0 24px}
.mystery-progress>span{display:block;height:100%;background:linear-gradient(90deg,#ad7857,#e2bd8a);transition:width .25s}
.mystery-tabs{display:flex;gap:8px;margin:18px 0 17px;overflow:auto;padding-bottom:5px}
.mystery-tab{border:1px solid #465065;background:#242b3b;color:#d1d6df;padding:11px 15px;white-space:nowrap;border-radius:10px;font-size:13px;font-weight:750}
.mystery-tab.active{background:#d0a779;border-color:#d0a779;color:#1c2330}
.mystery-item-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:13px}
.mystery-item{width:100%;text-align:left;border:1px solid #475062;background:#2a3243;border-radius:13px;padding:15px;color:#eaeef4;display:flex;flex-direction:column;gap:7px;min-height:112px}
.mystery-item:hover{border-color:#d6ad7d;background:#364052}
.mystery-item.done{border-color:#648b7a;background:#2c413d}
.mystery-item .mystery-emoji{font-size:26px}
.mystery-item strong{font-size:14px}.mystery-item small{color:#b9c1d1;line-height:1.5}
.mystery-room-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.mystery-room{border:1px solid #50586b;border-radius:999px;color:#e5e8ee;background:#232b3b;padding:8px 14px;font-size:13px;font-weight:700}
.mystery-room.active{border-color:#d9aa75;background:#4a3d39}
.mystery-note{padding:16px;border:1px solid #4a5365;border-radius:12px;background:#222938;margin:12px 0}
.mystery-note strong{display:block;color:#e6c392;margin-bottom:7px;font-size:15px}.mystery-note p{margin:0;color:#d4dbe5;font-size:14px}
.mystery-evidence{border:1px solid #544d59;background:#312e3b;border-radius:12px;padding:18px;margin-top:17px}
.mystery-evidence h3{color:#e9c99a;margin:0 0 9px;font-size:16px}
.mystery-evidence p{color:#e6dbe0;margin:0 0 14px}
.mystery-suspect-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.mystery-suspect{border:1px solid #475062;border-radius:13px;background:#2a3141;color:#e6eaf1;text-align:left;padding:14px;min-height:105px}
.mystery-suspect.active{border-color:#d3a878;background:#4b3e3c}
.mystery-suspect span{display:block;font-size:25px;margin-bottom:7px}
.mystery-suspect strong{font-size:15px}
.mystery-suspect small{display:block;margin-top:3px;font-size:12px;color:#bec5d2}
.mystery-field{display:flex;flex-direction:column;gap:8px;margin:18px 0;color:#f1e3d3;font-weight:750;font-size:14px}
.mystery-field select{border:1px solid #70778b;border-radius:10px;padding:12px;background:#282f41;color:#fff;width:100%;font-size:14px}
.mystery-highlight{color:#e8bf8b;font-weight:800}
.mystery-warning{border:1px solid #8c6c53;background:#4f3b32;border-radius:12px;padding:12px 15px;color:#f5e0c5;margin:14px 0;font-size:13px;line-height:1.65}
.mystery-success{border:1px solid #588775;background:#29463d;border-radius:12px;padding:12px 15px;color:#d4f4e7;margin:14px 0;font-size:13px;line-height:1.65}
.mystery-result-score{font-size:34px;font-weight:900;color:#f5ca94;margin:12px 0}
.mystery-divider{height:1px;background:#434b5e;margin:20px 0}
.mystery-footer-note{margin-top:22px;font-size:12px;color:#a1acbb}
@media(max-width:780px){.mystery-content{padding:29px 15px 46px}.mystery-grid{grid-template-columns:1fr}.mystery-panel{padding:17px}.mystery-item-grid{grid-template-columns:1fr 1fr}.mystery-title{letter-spacing:-.5px}.mystery-suspect-list{gap:6px}.mystery-suspect{padding:9px}.mystery-suspect strong{font-size:13px}.mystery-suspect small{font-size:11px}}
@media(max-width:380px){.mystery-item-grid{grid-template-columns:1fr}.mystery-tabs{gap:5px}.mystery-tab{padding:9px 10px;font-size:12px}}
@media(prefers-reduced-motion:reduce){.mystery-progress>span,.mystery-btn{transition:none}}

/* Wednesday case: four suspects visible on desktop; two per row on mobile */
.mystery-suspect-list{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:780px){.mystery-suspect-list{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Investigation notebook: evidence-gated chronology */
.mystery-timeline{border:1px solid #495366;border-radius:13px;overflow:hidden;margin:14px 0 22px;background:#232b3a}
.mystery-timeline-row{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;align-items:start;padding:11px 14px;border-top:1px solid #414a5c;line-height:1.5;font-size:13px}
.mystery-timeline-row:first-child{border-top:0}
.mystery-timeline-row time{font-variant-numeric:tabular-nums;font-weight:800;color:#e2ba83;white-space:nowrap}
.mystery-timeline-row span{color:#d3dae5;overflow-wrap:anywhere;word-break:keep-all}
@media(max-width:390px){.mystery-timeline-row{grid-template-columns:78px minmax(0,1fr);gap:8px;padding:10px;font-size:12px}}
</style>
</head>

<script>/* DOPAMIN MYSTERY — solo playable prototype, case 001 (fictional characters and events). */
(()=>{
  'use strict';
  const app=document.getElementById('app');
  const STORAGE_KEY='dott_mystery_wednesday_case001_v5';
  const title='수요일의 일격';
  const incident='20:58';
  const rooms=['정모실','회의실','창고','출입구'];
  const suspects=[
    {id:'daeun',name:'허다은',emoji:'📅',role:'캘박 누락에 폭발 직전',motive:'장한철이 수요일 참석 일정을 또 캘박하지 않아 예약이 겹쳤고, 뒷수습은 매번 다은의 몫이었다.',statement:'“20시 54분부터 21시 01분까지 회의실에서 화상통화를 했어요. 20시 58분에도 예약자 질문에 직접 대답했고요.”',detail:'통화 중 옆 정모실에서 쿵 하는 소리를 들었으나 의자가 넘어진 소리로 생각했다. 통화 후 정리 메모를 남겼다.'},
    {id:'seungmin',name:'손승민',emoji:'🧗',role:'클라이밍 얘기에 지친 회원',motive:'보드게임 모임인데 회장은 틈만 나면 클라이밍 얘기. “도파민이 클라이밍 동호회냐”는 말까지 했다.',statement:'“20시 53분에 창고로 들어가서 21시 02분까지 카드랑 게임을 정리했어요. 중간에 나가지 않았습니다.”',detail:'평소 카드 보관함을 자주 정리하던 담당이었다. 정확히 언제 마지막으로 만졌는지는 기록을 확인해야 한다. 사건 시각에는 창고에 있었다고 주장한다.'},
    {id:'jihoon',name:'박지훈',emoji:'🌙',role:'23시 벙 시작에 지친 회원',motive:'일찍 시작한다던 벙을 회장이 또 23시 10분으로 늦췄다. 지훈은 다음 날 아침 일찍 출근해야 했다.',statement:'“20시 55분에 간식 사러 편의점에 갔어요. 20시 57분 결제 영수증도 있고 21시 04분까지 매장에 있었어요. 그때 도트 안에 없었죠.”',detail:'사건 직후 편의점 영수증을 먼저 내밀며 결백을 주장했다. 회장에게 늦은 벙 시작을 항의한 메시지가 남아 있다.'},
    {id:'jei',name:'서제이',emoji:'🚭',role:'담배 냄새에 질린 회원',motive:'장한철의 흡연 후 실내에 남는 담배 냄새가 싫었고 늦은 벙 시작에도 불만이 쌓였다.',statement:'“20시 55분에 답답해서 건물 밖으로 나갔고, 21시 02분 30초에 다시 들어왔어요. 문 CCTV랑 출입 기록 확인해보세요.”',detail:'그날도 회장의 흡연 습관에 항의했다. 그러나 사건 시각에는 건물 밖에 있었다고 주장한다.'}
  ];
  const clues=[
    {id:'plan',room:'정모실',icon:'🗺️',name:'도트 공간 안내도',text:'이 게임의 가상 도트는 정모실, 회의실, 창고, 주출입구로 이루어진다. 정모실과 회의실은 얇은 벽 하나를 사이에 둔다. 건물에 드나들 수 있는 통로는 주출입구와 비상구뿐이다. 비상구는 열리면 경보가 울리는데 이날 경보·개방 기록이 없었다. 나머지 창문은 모두 고정창이며 손상 흔적이 없다. 20시 45분 당시 내부 인원은 장한철과 네 용의자뿐이고, 21시 07분까지 다른 사람의 출입도 없었다. 모든 디지털 기록의 시각은 같은 표준시로 동기화돼 있다.'},
    {id:'box',room:'정모실',icon:'🗃️',name:'금속 카드 보관함',text:'정모실 책상 아래에 무거운 금속 카드 보관함이 떨어져 있다. 모서리에 새 충돌 자국이 있지만 정확한 용도는 감식 전이다. 손잡이에는 여러 사람의 접촉 흔적이 남았다.'},
    {id:'medical',phase:2,room:'정모실',icon:'🩺',name:'현장 감식·응급 진료 소견',text:'추가 감식에서 피해자 머리 측면의 타박 흔적은 금속 카드 보관함 모서리의 형태·폭과 부합하며, 보관함에는 새 충돌 흔적도 확인됐다. 사고성 낙상보다 외부 충격의 개연성이 높다. 다만 이 소견만으로 누가 사용했는지는 특정할 수 없다.'},
    {id:'watch',phase:2,room:'정모실',icon:'⌚',name:'스마트워치 활동 기록',text:'장한철의 스마트워치는 20시 58분 13초에 강한 충격과 쓰러짐에 해당하는 움직임을 기록했고 이후 활동이 거의 없다. 회의실 화상통화에 기록된 충격음(20시 58분 12초)과 1초 차이다. 의료 기기는 아니며 다른 단서와 함께 봐야 한다.'},
    {id:'clock',room:'정모실',icon:'🕰️',name:'바닥에서 깨진 탁상시계',text:'회장 책상에 있던 시계가 바닥에 떨어져 20시 58분 부근에서 멈췄다. 충격으로 멈춘 시계는 정확한 범행 시간을 확정하지 못한다. 다른 시각 자료가 더 필요하다.'},
    {id:'notice',room:'정모실',icon:'📱',name:'20시 48분 단체방 대화',text:'장한철: “본게임은 오늘도 23시 10분부터! 클라이밍 썰부터 푼다ㅋㅋ” / 허다은: “캘박도 안 해놓고 또요?” / 손승민: “클라이밍 얘기 그만 좀요.” / 박지훈: “내일 출근인데 또 11시 넘게 시작한다고요?” / 서제이: “흡연 문제도 오늘 얘기할 거예요.” 네 명 모두 짜증이 드러나 있다.'},
    {id:'transfer',phase:2,room:'정모실',icon:'📷',name:'20시 45분 준비 사진 원본',text:'단체방에 손승민이 20시 45분 게시한 사진에 금속 카드함이 이미 정모실 책상 위에 놓여 있으며, 손승민이 손잡이를 잡은 모습도 선명하다. 지문을 남겼을 수 있는 범행 이전의 접촉 시각이 확인된다.'},

      const item=clues.find(c=>c.id===id);if(!item||(item.phase&&item.phase>state.phase))return;

        ui.feedback='손승민: “그 물건 제가 자주 옮겨요. 지문이 있는 건 당연하죠. 마지막으로 만진 시각은 확인해 보세요.” 손잡이 지문은 접촉 사실만 보여주고 정확한 시각은 증명하지 않습니다.';
      }else if(ui.suspect==='jei'&&evidence==='spray'){
        ui.feedback='서제이: “제 탈취제 맞는데, 그게 왜 의자 밑에 있어요? 저는 아까 책상 쪽에 뒀어요.” 지금은 물건의 이동 경위가 확인되지 않았습니다.';
      }else if(ui.suspect==='daeun'&&evidence==='call'){
        ui.feedback='🔎 20시 58분 12초 충격음이 녹음된 순간 허다은은 회의실 화상통화 화면에서 실시간 대화를 하고 있었습니다.';
      }else if(ui.suspect==='seungmin'&&evidence==='transfer'){
        ui.feedback='🔎 20시 45분 준비 사진에서 손승민이 카드함 손잡이를 잡은 사실이 확인됩니다. 지문은 사건 이전에 남았을 가능성이 있습니다.';
      }else if(ui.suspect==='seungmin'&&evidence==='warehouse'){
        ui.feedback='🔎 창고문과 복도 영상에 20시 53분~21시 02분 출입 흔적이 없습니다. 카드함은 20시 45분부터 이미 정모실에 있었습니다.';
      }else if(ui.suspect==='jei'&&evidence==='group'){
        ui.feedback='🔎 확대된 20시 50분 원본 사진에는 서제이의 탈취제가 이미 책상 위에 있습니다. 사건 후 의자 아래에 발견됐다는 사실만으로 공격자가 누구인지 알 수는 없습니다.';
      }else if(ui.suspect==='jei'&&evidence==='gatevideo'){
        ui.feedback='🔎 서제이는 20시 55분에 건물을 나갔고 21시 02분 30초에 돌아왔습니다. 주출입구 CCTV 영상으로 얼굴까지 확인됩니다.';
      }else ui.feedback='이 증거만으로는 이 진술의 진위를 확정할 수 없습니다. 사건 시각과 다른 자료를 비교해보세요.';
    }
    else if(action==='submit'){
      if(!canSubmit())return;
      const person=document.getElementById('mystery-answer-person')?.value;
      const motive=document.getElementById('mystery-answer-motive')?.value;
      const weapon=document.getElementById('mystery-answer-weapon')?.value;
      const evidence=document.getElementById('mystery-answer-evidence')?.value;
      if(!person||!motive||!weapon||!evidence)ui.feedback='범인, 동기, 사용한 물건, 핵심 증거까지 모두 선택해주세요.';
      else if(!suspectIds.has(person)||!['calendar','climbing','late','smoking'].includes(motive)||!['metalbox','clock','mug','book'].includes(weapon)||!state.clues.includes(evidence)){ui.feedback='선택 항목 중 확인되지 않은 내용이 있습니다. 수사 기록을 다시 확인해주세요.';}
      else {state.submitted=true;state.answer={person,motive,weapon,evidence};save();ui.view='result';ui.feedback='';}
    }
    else if(action==='restart'){
      if(!window.confirm('기존 수사 기록을 지우고 처음부터 다시 할까요?'))return;
      state=defaults();save();ui.view='intro';ui.tab='investigate';ui.room='정모실';ui.suspect='daeun';ui.selectedClue=null;ui.feedback='';
    }else return;
    render();
  });
  render();
})();</script>
