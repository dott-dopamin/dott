<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f9fc"><title>DOTT 게임 대여</title><link rel="stylesheet" href="rental.css?v=20261003-multi-receipts"></head><body><main class="rental-page"><section class="rental-card"><div class="brand">DOTT</div><h1>📦 게임 대여하기</h1><p class="intro">빌려갈 게임과 대여자를 선택해주세요.</p>
      <div class="rental-warning" role="note">
        <div class="rental-warning-title">⚠️ 대여 전 꼭 확인해주세요</div>
        <div class="rental-warning-line">• 게임 대여는 <b>운영진과 사전 협의 후</b> 등록해주세요.</div>
        <div class="rental-warning-line">• 반납 시 <b>반드시 운영진에게 알려주세요.</b><br><span>별도 확인이 없으면 계속 대여중으로 처리됩니다.</span></div>
      </div><div id="loadState" class="notice">대여 정보를 불러오는 중...</div><form id="rentalForm" hidden><div class="field-block"><label for="gameSearch">게임</label><div class="search-wrap"><input id="gameSearch" type="search" autocomplete="off" placeholder="게임 이름을 검색하세요"><button id="clearGame" class="clear-btn" type="button">×</button></div><div id="gameResults" class="results" hidden></div><div id="selectedGame" class="selected" hidden></div><input id="gameId" type="hidden"></div><div class="field-block"><label for="memberSearch">대여자</label><div class="search-wrap"><input id="memberSearch" type="search" autocomplete="off" placeholder="회원 이름을 검색하세요"><button id="clearMember" class="clear-btn" type="button">×</button></div><div id="memberResults" class="results" hidden></div><div id="selectedMember" class="selected" hidden></div><input id="borrower" type="hidden"></div><div class="field-block"><label for="rentedAt">대여일</label><input id="rentedAt" class="date-input" type="date" required></div><div id="formError" class="error"></div><button id="submitBtn" class="submit-btn" type="submit">대여하기</button></form></section><p class="foot">대여 등록 후 게임 상태가 자동으로 <b>대여중</b>으로 변경됩니다.</p></main><div id="doneModal" class="modal" hidden><div class="modal-box"><div class="done-icon">✓</div><h2>대여 등록 완료!</h2><p id="doneText"></p><button id="doneClose" type="button">확인</button></div></div><script src="config.js?v=20261003-multi-receipts"></script><script src="rental.js?v=20261003-multi-receipts"></script></body></html>
