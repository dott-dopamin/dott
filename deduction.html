<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOTT 추리게임</title><link rel="stylesheet" href="styles-v33.css?v=61"><style>
/* 보유 리스트 설명문 폰트 - 머더미스터리와 동일 */
.catalog-page .hero p{font-size:14px!important;line-height:1.7!important}


/* DOTT v57: 보드게임/추리게임 PC·모바일 칸 균형 재배치 */
.catalog-kind-table{table-layout:fixed!important}
.catalog-kind-table th,.catalog-kind-table td{text-align:center!important;vertical-align:middle}
.catalog-kind-table th{text-align:center!important}
.catalog-kind-table td:first-child{text-align:left!important}
.catalog-kind-table .catalog-name{min-width:0}
.catalog-name-inner{display:flex;align-items:center;gap:6px;min-width:0}
.catalog-kind-table .catalog-name-text{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catalog-kind-table .boardgame-expansion-badge{flex:0 0 auto}
.catalog-kind-table .catalog-note{text-align:center!important;max-width:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catalog-status{border:1px solid transparent}
.catalog-status.status-owned{background:#edf7ef;color:#3c8152;border-color:#d7eadc}
.catalog-status.status-rented{background:#fff1df;color:#b96b22;border-color:#f4d7b5}
.catalog-status.status-lost{background:#fde9e9;color:#b13b3b;border-color:#f1c8c8}
.catalog-status.status-dott{background:#eaf3ff;color:#3c6fa8;border-color:#d0e2f7}
.catalog-status.status-workshop{background:#f1ebfb;color:#6c53a3;border-color:#ddd1f0}

/* DOTT v61 PC 비율 - 시간 범위와 5칸 난이도 게이지를 한 줄로 보여주도록 재배분 */
.catalog-kind-table.boardgame-table th:nth-child(1),.catalog-kind-table.boardgame-table td:nth-child(1){width:27%!important}
.catalog-kind-table.boardgame-table th:nth-child(2),.catalog-kind-table.boardgame-table td:nth-child(2){width:9%!important}
.catalog-kind-table.boardgame-table th:nth-child(3),.catalog-kind-table.boardgame-table td:nth-child(3){width:12%!important}
.catalog-kind-table.boardgame-table th:nth-child(4),.catalog-kind-table.boardgame-table td:nth-child(4){width:14%!important}
.catalog-kind-table.boardgame-table th:nth-child(5),.catalog-kind-table.boardgame-table td:nth-child(5){width:12%!important}
.catalog-kind-table.boardgame-table th:nth-child(6),.catalog-kind-table.boardgame-table td:nth-child(6){width:13%!important}
.catalog-kind-table.boardgame-table th:nth-child(7),.catalog-kind-table.boardgame-table td:nth-child(7){width:13%!important}

.catalog-kind-table.deduction-table th:nth-child(1),.catalog-kind-table.deduction-table td:nth-child(1){width:27%!important}
.catalog-kind-table.deduction-table th:nth-child(2),.catalog-kind-table.deduction-table td:nth-child(2){width:9%!important}
.catalog-kind-table.deduction-table th:nth-child(3),.catalog-kind-table.deduction-table td:nth-child(3){width:12%!important}
.catalog-kind-table.deduction-table th:nth-child(4),.catalog-kind-table.deduction-table td:nth-child(4){width:14%!important}
.catalog-kind-table.deduction-table th:nth-child(5),.catalog-kind-table.deduction-table td:nth-child(5){width:12%!important}
.catalog-kind-table.deduction-table th:nth-child(6),.catalog-kind-table.deduction-table td:nth-child(6){width:13%!important}
.catalog-kind-table.deduction-table th:nth-child(7),.catalog-kind-table.deduction-table td:nth-child(7){width:13%!important}

@media(max-width:700px){
  .catalog-kind-table{width:100%!important;min-width:0!important;table-layout:fixed!important}
  .catalog-kind-table th,.catalog-kind-table td{padding:6px 2px!important;font-size:8.4px!important;overflow:hidden}
  .catalog-kind-table th{font-size:8px!important;letter-spacing:-.22px;text-align:center!important}
  .catalog-kind-table .catalog-name{padding-left:5px!important}
  .catalog-name-inner{gap:3px}
  .catalog-kind-table .catalog-name-text{font-size:8.5px}
  .catalog-kind-table td:nth-child(2),.catalog-kind-table td:nth-child(3),.catalog-kind-table td:nth-child(4),.catalog-kind-table td:nth-child(5),.catalog-kind-table td:nth-child(6),.catalog-kind-table td:nth-child(7){letter-spacing:-.18px}
  .catalog-kind-table .boardgame-expansion-badge{margin-left:0;padding:2px 4px;font-size:7px}
  .catalog-kind-table .catalog-status{font-size:7.6px;padding:2px 3px}

  /* DOTT v61 mobile: 60~90분 한 줄 + 난이도 5칸 전체 노출 기준 재배분 */
  .catalog-kind-table.boardgame-table th:nth-child(1),.catalog-kind-table.boardgame-table td:nth-child(1){width:24%!important}
  .catalog-kind-table.boardgame-table th:nth-child(2),.catalog-kind-table.boardgame-table td:nth-child(2){width:9%!important}
  .catalog-kind-table.boardgame-table th:nth-child(3),.catalog-kind-table.boardgame-table td:nth-child(3){width:14%!important}
  .catalog-kind-table.boardgame-table th:nth-child(4),.catalog-kind-table.boardgame-table td:nth-child(4){width:17%!important}
  .catalog-kind-table.boardgame-table th:nth-child(5),.catalog-kind-table.boardgame-table td:nth-child(5){width:11%!important}
  .catalog-kind-table.boardgame-table th:nth-child(6),.catalog-kind-table.boardgame-table td:nth-child(6){width:13%!important}
  .catalog-kind-table.boardgame-table th:nth-child(7),.catalog-kind-table.boardgame-table td:nth-child(7){width:12%!important}

  .catalog-kind-table.deduction-table th:nth-child(1),.catalog-kind-table.deduction-table td:nth-child(1){width:24%!important}
  .catalog-kind-table.deduction-table th:nth-child(2),.catalog-kind-table.deduction-table td:nth-child(2){width:9%!important}
  .catalog-kind-table.deduction-table th:nth-child(3),.catalog-kind-table.deduction-table td:nth-child(3){width:14%!important}
  .catalog-kind-table.deduction-table th:nth-child(4),.catalog-kind-table.deduction-table td:nth-child(4){width:17%!important}
  .catalog-kind-table.deduction-table th:nth-child(5),.catalog-kind-table.deduction-table td:nth-child(5){width:11%!important}
  .catalog-kind-table.deduction-table th:nth-child(6),.catalog-kind-table.deduction-table td:nth-child(6){width:13%!important}
  .catalog-kind-table.deduction-table th:nth-child(7),.catalog-kind-table.deduction-table td:nth-child(7){width:12%!important}
}


/* DOTT v61: 플레이시간은 60~90분 같은 범위도 한 줄 고정 */
.catalog-kind-table th:nth-child(3),.catalog-kind-table td:nth-child(3){white-space:nowrap!important;word-break:keep-all!important}

/* DOTT v60: 보드게임/추리게임 난이도 5칸 게이지 + 모바일 5칸 보장 */
.catalog-kind-table .catalog-difficulty{text-align:center!important;white-space:nowrap!important}
.difficulty-meter{display:inline-flex;align-items:center;gap:3px;vertical-align:middle;white-space:nowrap}
.difficulty-box{display:inline-block;width:11px;height:11px;box-sizing:border-box;border:1px solid #dccdc0;border-radius:2px;background:linear-gradient(90deg,#e46f3a 0 var(--fill),#fffaf6 var(--fill) 100%)}
@media(max-width:700px){
  .catalog-kind-table .catalog-difficulty{padding-left:1px!important;padding-right:1px!important;overflow:visible!important}
  .difficulty-meter{gap:1.5px;max-width:100%}
  .difficulty-box{width:8px;height:8px;border-radius:1.5px;flex:0 0 8px}
}

/* DOTT v66: PC typography synced to boardgame list baseline */
@media(min-width:701px){
  .catalog-page .hero h1{font-size:42px!important;line-height:1.18!important;font-weight:500!important;letter-spacing:-1.6px!important}
  .catalog-page .hero p{font-size:14px!important;line-height:1.7!important}
  .catalog-kind-table th,.catalog-kind-table td{font-size:12px!important}
  .catalog-kind-table th{font-size:11px!important}
  .catalog-page .eyebrow{font-size:12px!important}
}
</style></head><body data-kind="deduction"><div class="shell" id="app"></div><script src="bootstrap-v33.js?v=dott-v61-playtime-range" data-entry="catalog-v61.js"></script></body></html>
